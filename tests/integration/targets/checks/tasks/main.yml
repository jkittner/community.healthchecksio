- name: Testing checks
  block:

    - name: Ensure API key is provided
      ansible.builtin.fail:
        msg: api_key needs to be defined in tests/integration/integration_config.yml
      when:
        - api_key is not defined
        - api_key | length == 0

    - name: Create a Cron check named "cron test"
      community.healthchecksio.checks:
        state: present
        channels: "*"  # also test idempotency for channels
        api_key: "{{ api_key }}"
        management_api_base_url: "{{ management_api_base_url }}"
        ping_api_base_url: "{{ ping_api_base_url }}"
        name: cron test
        unique: ["name"]
        schedule: 7 7 * * *
        tz: UTC
      register: result

    - name: Create a Cron check named "cron test" - test idempotency
      community.healthchecksio.checks:
        state: present
        channels: "*"  # also test idempotency for channels
        api_key: "{{ api_key }}"
        management_api_base_url: "{{ management_api_base_url }}"
        ping_api_base_url: "{{ ping_api_base_url }}"
        name: cron test
        unique: ["name"]
        schedule: 7 7 * * *
        tz: UTC
      register: result_idempotency

    - name: Verify integrations
      ansible.builtin.assert:
        that:
          - result.changed
          - result.data is defined
          - result.data.name is defined
          - result.data.name == "cron test"
          - result.uuid is defined
          - result_idempotency.changed == false

    - name: Set a fact for the check
      ansible.builtin.set_fact:
        uuid: "{{ result.uuid }}"

    - name: Pause for ten seconds
      ansible.builtin.pause:
        seconds: 10

    - name: Delete the Cron check
      community.healthchecksio.checks:
        state: absent
        api_key: "{{ api_key }}"
        management_api_base_url: "{{ management_api_base_url }}"
        ping_api_base_url: "{{ ping_api_base_url }}"
        uuid: "{{ uuid }}"
      register: result

    - name: Verify integrations
      ansible.builtin.assert:
        that:
          - result.changed
          - result.msg is defined
          - result.msg == "Check " ~ uuid ~ " successfully deleted"

    - name: Create a Simple check named "simple test"
      community.healthchecksio.checks:
        state: present
        api_key: "{{ api_key }}"
        management_api_base_url: "{{ management_api_base_url }}"
        ping_api_base_url: "{{ ping_api_base_url }}"
        name: simple test
        unique: ["name"]
        timeout: 77
      register: result

    - name: Verify integrations
      ansible.builtin.assert:
        that:
          - result.changed
          - result.data is defined
          - result.data.name is defined
          - result.data.name == "simple test"
          - result.uuid is defined

    - name: Set a fact for the check
      ansible.builtin.set_fact:
        uuid: "{{ result.uuid }}"

    - name: Pause for ten seconds
      ansible.builtin.pause:
        seconds: 10

    - name: Delete the Simple check
      community.healthchecksio.checks:
        state: absent
        api_key: "{{ api_key }}"
        management_api_base_url: "{{ management_api_base_url }}"
        ping_api_base_url: "{{ ping_api_base_url }}"
        uuid: "{{ uuid }}"
      register: result

    - name: Verify integrations
      ansible.builtin.assert:
        that:
          - result.changed
          - result.msg is defined
          - result.msg == "Check " ~ uuid ~ " successfully deleted"

    - name: Create a check with a custom slug
      community.healthchecksio.checks:
        state: present
        api_key: "{{ api_key }}"
        management_api_base_url: "{{ management_api_base_url }}"
        ping_api_base_url: "{{ ping_api_base_url }}"
        name: check with slug
        slug: my-custom-slug
        unique: ["slug"]
        timeout: 120
        tags: ["testing", "v3"]
      register: result

    - name: Verify slug check creation
      ansible.builtin.assert:
        that:
          - result.changed
          - result.data is defined
          - result.data.slug == "my-custom-slug"
          - result.uuid is defined

    - name: Set a fact for the slug check
      ansible.builtin.set_fact:
        slug_check_uuid: "{{ result.uuid }}"

    - name: Pause the check by UUID
      community.healthchecksio.checks:
        state: pause
        api_key: "{{ api_key }}"
        management_api_base_url: "{{ management_api_base_url }}"
        ping_api_base_url: "{{ ping_api_base_url }}"
        uuid: "{{ slug_check_uuid }}"
      register: result

    - name: Verify pause
      ansible.builtin.assert:
        that:
          - result.changed
          - result.msg is search("successfully paused")

    - name: Resume the check
      community.healthchecksio.checks:
        state: resume
        api_key: "{{ api_key }}"
        management_api_base_url: "{{ management_api_base_url }}"
        ping_api_base_url: "{{ ping_api_base_url }}"
        uuid: "{{ slug_check_uuid }}"
      register: result

    - name: Verify resume
      ansible.builtin.assert:
        that:
          - result.changed
          - result.msg is search("successfully resumed")

    - name: Delete the slug check
      community.healthchecksio.checks:
        state: absent
        api_key: "{{ api_key }}"
        management_api_base_url: "{{ management_api_base_url }}"
        ping_api_base_url: "{{ ping_api_base_url }}"
        uuid: "{{ slug_check_uuid }}"
      register: result

    - name: Verify slug check deletion
      ansible.builtin.assert:
        that:
          - result.changed
          - result.msg is search("successfully deleted")

    - name: Create a check with keyword filtering
      community.healthchecksio.checks:
        state: present
        api_key: "{{ api_key }}"
        management_api_base_url: "{{ management_api_base_url }}"
        ping_api_base_url: "{{ ping_api_base_url }}"
        name: check with keywords
        unique: ["name"]
        timeout: 300
        success_kw: "SUCCESS"
        failure_kw: "FAILED"
        filter_http_body: true
        tags: ["keyword-test"]
      register: result

    - name: Verify keyword filtering check creation
      ansible.builtin.assert:
        that:
          - result.changed
          - result.data is defined
          - result.data.success_kw == "SUCCESS"
          - result.data.failure_kw == "FAILED"
          - result.data.filter_http_body == true
          - result.uuid is defined

    - name: Set a fact for the keyword filtering check
      ansible.builtin.set_fact:
        keyword_check_uuid: "{{ result.uuid }}"

    - name: Delete the keyword filtering check
      community.healthchecksio.checks:
        state: absent
        api_key: "{{ api_key }}"
        management_api_base_url: "{{ management_api_base_url }}"
        ping_api_base_url: "{{ ping_api_base_url }}"
        uuid: "{{ keyword_check_uuid }}"
      register: result

    - name: Verify keyword check deletion
      ansible.builtin.assert:
        that:
          - result.changed
          - result.msg is search("successfully deleted")

    - name: Create an invalid check (mutally exclusive)
      community.healthchecksio.checks:
        state: present
        api_key: "{{ api_key }}"
        management_api_base_url: "{{ management_api_base_url }}"
        ping_api_base_url: "{{ ping_api_base_url }}"
        name: simple test
        unique: ["name"]
        timeout: 77
        schedule: 7 7 * * *
      register: result
      ignore_errors: true

    - name: Verify integrations
      ansible.builtin.assert:
        that:
          - result.failed
          - result.msg is search("parameters are mutually exclusive")

    - name: Create a Cron check named "cron test grace"
      community.healthchecksio.checks:
        state: present
        api_key: "{{ api_key }}"
        management_api_base_url: "{{ management_api_base_url }}"
        ping_api_base_url: "{{ ping_api_base_url }}"
        name: cron test grace
        unique: ["name"]
        schedule: "{{ schedule }}"
        tz: UTC
        grace: "{{ grace }}"
      register: result

    - name: Verify integrations
      ansible.builtin.assert:
        that:
          - result.changed
          - result.data is defined
          - result.data.name is defined
          - result.data.name == "cron test grace"
          - result.uuid is defined
          - result.data.schedule == schedule
          - result.data.grace == grace

    - name: Set a fact for the check
      ansible.builtin.set_fact:
        uuid: "{{ result.uuid }}"

    - name: Pause for ten seconds
      ansible.builtin.pause:
        seconds: 10

    - name: Delete the Cron check
      community.healthchecksio.checks:
        state: absent
        api_key: "{{ api_key }}"
        management_api_base_url: "{{ management_api_base_url }}"
        ping_api_base_url: "{{ ping_api_base_url }}"
        uuid: "{{ uuid }}"
      register: result

    - name: Verify integrations
      ansible.builtin.assert:
        that:
          - result.changed
          - result.msg is defined
          - result.msg == "Check " ~ uuid ~ " successfully deleted"

    - name: Create a Simple check named "simple test"
      community.healthchecksio.checks:
        state: present
        api_key: "{{ api_key }}"
        management_api_base_url: "{{ management_api_base_url }}"
        ping_api_base_url: "{{ ping_api_base_url }}"
        name: simple test
        unique: ["name"]
        timeout: 77
      register: result

    - name: Verify integrations
      ansible.builtin.assert:
        that:
          - result.changed
          - result.data is defined
          - result.data.name is defined
          - result.data.name == "simple test"
          - result.uuid is defined

    - name: Set a fact for the check
      ansible.builtin.set_fact:
        uuid: "{{ result.uuid }}"

    - name: Delete the Simple check
      community.healthchecksio.checks:
        state: absent
        api_key: "{{ api_key }}"
        management_api_base_url: "{{ management_api_base_url }}"
        ping_api_base_url: "{{ ping_api_base_url }}"
        uuid: "{{ uuid }}"
      register: result

    - name: Verify integrations
      ansible.builtin.assert:
        that:
          - result.changed
          - result.msg is defined
          - result.msg == "Check " ~ uuid ~ " successfully deleted"
